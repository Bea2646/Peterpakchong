<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ไม่พบหน้าที่ต้องการ (404) — บ้านปีเตอร์@ปากช่อง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: #fef2f2;
      color: #ef4444;
      font-weight: 600;
      font-size: 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 64px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #15803d;
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #166534;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Error 404</div>
    <h1>404</h1>
    <h2>ไม่พบหน้าที่คุณต้องการ</h2>
    <p>หน้าที่คุณกำลังค้นหาอาจถูกย้าย ลบ หรือที่อยู่ URL ไม่ถูกต้อง</p>
    <a href="/" class="btn">กลับสู่หน้าแรก</a>
  </div>
</body>
</html>
